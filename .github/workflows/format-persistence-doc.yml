name: Format persistence design once

on:
  push:
    branches:
      - integration/cloudflare-persistence-design

permissions:
  contents: write

jobs:
  format:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: integration/cloudflare-persistence-design

      - name: Install Node.js
        uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6.4.0
        with:
          node-version-file: package.json
          package-manager-cache: false

      - name: Install repository pnpm
        run: npm install --global "$(node -p "require('./package.json').packageManager")"

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Format persistence design
        run: pnpm exec prettier --write docs/architecture/02_CLOUDFLARE_RUNTIME_PERSISTENCE.md

      - name: Remove one-time workflow and commit
        run: |
          git rm .github/workflows/format-persistence-doc.yml
          git add docs/architecture/02_CLOUDFLARE_RUNTIME_PERSISTENCE.md
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "docs: format Cloudflare persistence design"
          git push origin HEAD:integration/cloudflare-persistence-design
