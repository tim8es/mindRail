name: Domain contracts final verification

on:
  push:
    branches:
      - adr/domain-contracts

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Install Node.js
        uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6.4.0
        with:
          node-version-file: package.json
          package-manager-cache: false

      - name: Install repository pnpm
        run: npm install --global "$(node -p "require('./package.json').packageManager")"

      - name: Repository evidence
        run: |
          git status --short --branch
          git rev-parse HEAD
          git log --oneline -12

      - name: Frozen install
        run: pnpm install --frozen-lockfile

      - name: Formatting
        run: pnpm format:check

      - name: Lint
        run: pnpm lint

      - name: Typecheck
        run: pnpm typecheck

      - name: Generated bindings
        run: pnpm contracts:check-generated

      - name: Tests
        run: pnpm test

      - name: Full quality command
        run: pnpm check

      - name: Coverage
        run: pnpm test:coverage

      - name: Dependency boundary
        run: |
          node --input-type=module <<'NODE'
          import { readFile } from 'node:fs/promises';

          const root = JSON.parse(await readFile('package.json', 'utf8'));
          const contracts = JSON.parse(await readFile('packages/contracts/package.json', 'utf8'));
          const runtimeDependencies = Object.keys(contracts.dependencies ?? {});
          if (runtimeDependencies.length !== 0) {
            throw new Error(`@mindrail/contracts runtime dependencies: ${runtimeDependencies.join(', ')}`);
          }

          for (const dependency of ['@types/node', 'ajv', 'ajv-formats', 'json-schema-to-typescript']) {
            if (!(dependency in (root.devDependencies ?? {}))) {
              throw new Error(`${dependency} must remain a root devDependency`);
            }
            if (dependency in (root.dependencies ?? {})) {
              throw new Error(`${dependency} must not be a root runtime dependency`);
            }
          }

          console.log('@mindrail/contracts has zero runtime dependencies.');
          console.log('Contract schema/generation tooling is dev-only.');
          NODE

      - name: Canonical schema boundary audit
        run: |
          node --input-type=module <<'NODE'
          import { readFile } from 'node:fs/promises';

          const entities = [
            'workspace',
            'goal',
            'task',
            'agent',
            'session',
            'lease',
            'checkpoint',
            'permission-request',
            'permission-decision',
            'audit-event',
          ];

          for (const entity of entities) {
            const schema = JSON.parse(
              await readFile(`schemas/domain/v1/${entity}.schema.json`, 'utf8'),
            );
            if (schema.additionalProperties !== false) {
              throw new Error(`${entity} must reject unknown top-level properties`);
            }
          }

          console.log('All 10 v1 entity schemas set additionalProperties=false.');
          NODE

      - name: Negative generated-drift test
        shell: bash
        run: |
          set -euo pipefail
          target='packages/contracts/src/generated/v1/workspace.ts'
          backup="$RUNNER_TEMP/workspace.ts"
          cp "$target" "$backup"
          trap 'cp "$backup" "$target"' EXIT

          printf '\n// intentionally stale generated output\n' >> "$target"
          if pnpm contracts:check-generated; then
            echo '::error::contracts:check-generated unexpectedly accepted stale generated output'
            exit 1
          fi
          echo 'Expected contracts:check-generated failure observed.'

          cp "$backup" "$target"
          trap - EXIT
          pnpm contracts:check-generated
          git diff --exit-code
