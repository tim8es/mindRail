name: Implement durable query parity once
# rerun after removing obsolete unsupportedQuery helper

on:
  push:
    branches:
      - feature/durable-query-parity
    paths:
      - .github/workflows/implement-durable-query-parity-once.yml

permissions:
  contents: write

jobs:
  implement:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      - uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e
        with:
          node-version-file: package.json
          package-manager-cache: false
      - run: npm install --global "$(node -p "require('./package.json').packageManager")"
      - run: pnpm install --frozen-lockfile
      - run: python3 scripts/implement-durable-query-parity.py
      - run: pnpm exec prettier --write src/persistence/ports.ts src/persistence/cloudflare/d1-runtime-persistence.ts src/application/durable-dispatcher.ts test/application/durable-query-parity.test.ts
      - run: git rm .github/workflows/implement-durable-query-parity-once.yml scripts/implement-durable-query-parity.py
      - run: pnpm vitest run test/application/durable-query-parity.test.ts test/application/durable-queries.test.ts
      - run: pnpm check
      - run: pnpm test:coverage
      - run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/persistence/ports.ts src/persistence/cloudflare/d1-runtime-persistence.ts src/application/durable-dispatcher.ts test/application/durable-query-parity.test.ts
          git commit -m "feat: complete durable query parity"
          git push
