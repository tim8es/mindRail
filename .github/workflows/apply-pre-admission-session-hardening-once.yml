name: Apply pre-admission session hardening once

on:
  push:
    branches:
      - feature/local-runtime-vertical-slice

permissions:
  contents: write

jobs:
  green:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: feature/local-runtime-vertical-slice
      - name: Install Node.js
        uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6.4.0
        with:
          node-version-file: package.json
          package-manager-cache: false
      - name: Install repository pnpm
        run: npm install --global "$(node -p "require('./package.json').packageManager")"
      - name: Install dependencies
        run: pnpm install --frozen-lockfile
      - name: Harden protocol admission and Session authority
        shell: bash
        run: |
          node <<'NODE'
          const fs = require('node:fs');
          const path = 'src/runtime/in-memory-control-plane.ts';
          let source = fs.readFileSync(path, 'utf8');

          function replaceOnce(needle, replacement, label) {
            if (!source.includes(needle)) throw new Error(`Missing ${label}`);
            source = source.replace(needle, replacement);
          }

          function replaceSection(startNeedle, endNeedle, replacement, label) {
            const start = source.indexOf(startNeedle);
            if (start === -1) throw new Error(`Missing ${label} start`);
            const end = source.indexOf(endNeedle, start);
            if (end === -1) throw new Error(`Missing ${label} end`);
            source = source.slice(0, start) + replacement + source.slice(end);
          }

          replaceOnce(
            "} from './protocol.ts';\n",
            "} from './protocol.ts';\nimport { isProtocolEntityId, validateProtocolCommand } from './protocol-validation.ts';\n",
            'protocol validation import',
          );
          replaceOnce(
            '  leaseDurationMs: number;\n  validateCanonicalDomainRecord: CanonicalDomainValidator;',
            '  leaseDurationMs: number;\n  sessionTimeoutMs: number;\n  validateCanonicalDomainRecord: CanonicalDomainValidator;',
            'session timeout option',
          );
          replaceOnce(
            '  private readonly leaseDurationMs: number;\n  private readonly validateCanonicalDomainRecord: CanonicalDomainValidator;',
            '  private readonly leaseDurationMs: number;\n  private readonly sessionTimeoutMs: number;\n  private readonly validateCanonicalDomainRecord: CanonicalDomainValidator;',
            'session timeout field',
          );
          replaceOnce(
            "    if (options.leaseDurationMs <= 0) {\n      throw new RuntimeError('INVALID_INPUT', 'leaseDurationMs must be positive.');\n    }\n\n    this.now = options.now;",
            "    if (options.leaseDurationMs <= 0) {\n      throw new RuntimeError('INVALID_INPUT', 'leaseDurationMs must be positive.');\n    }\n    if (options.sessionTimeoutMs <= 0) {\n      throw new RuntimeError('INVALID_INPUT', 'sessionTimeoutMs must be positive.');\n    }\n\n    this.now = options.now;",
            'session timeout validation',
          );
          replaceOnce(
            '    this.leaseDurationMs = options.leaseDurationMs;\n    this.validateCanonicalDomainRecord = options.validateCanonicalDomainRecord;',
            '    this.leaseDurationMs = options.leaseDurationMs;\n    this.sessionTimeoutMs = options.sessionTimeoutMs;\n    this.validateCanonicalDomainRecord = options.validateCanonicalDomainRecord;',
            'session timeout assignment',
          );

          const execute = [
            '  execute(command: ProtocolCommand): ProtocolResponse {',
            '    const validation = validateProtocolCommand(command);',
            '    if (!validation.valid) {',
            "      const details = validation.errors?.slice(0, 3).join('; ') ?? 'invalid command envelope';",
            "      return this.protocolPreAdmissionFailure(command, 'INVALID_INPUT', details);",
            '    }',
            '',
            '    try {',
            '      this.assertWorkspace(command.workspaceId);',
            '    } catch (error) {',
            '      if (!(error instanceof RuntimeError)) {',
            '        throw error;',
            '      }',
            '      return this.protocolPreAdmissionFailure(command, error.code, error.message);',
            '    }',
            '',
            '    const receiptKey = `${command.workspaceId}\\u0000${command.commandId}`;',
            '    const fingerprint = semanticFingerprint(command);',
            '    const existing = this.commandReceipts.get(receiptKey);',
            '',
            '    if (existing) {',
            '      if (existing.fingerprint !== fingerprint) {',
            '        return this.protocolFailure(',
            '          command,',
            "          'IDEMPOTENCY_CONFLICT',",
            '          `Command id ${command.commandId} was already used for different semantic intent.`,',
            '          false,',
            '        );',
            '      }',
            '      const replay = clone(existing.response);',
            '      replay.replayed = true;',
            '      if (command.correlationId === undefined) {',
            '        delete replay.correlationId;',
            '      } else {',
            '        replay.correlationId = command.correlationId;',
            '      }',
            '      return replay;',
            '    }',
            '',
            '    let response: ProtocolResponse;',
            '    try {',
            '      response = this.protocolSuccess(command, this.dispatchCommand(command), false);',
            '    } catch (error) {',
            '      if (!(error instanceof RuntimeError)) {',
            '        throw error;',
            '      }',
            '      response = this.protocolFailure(command, error.code, error.message, false);',
            '    }',
            '',
            '    this.commandReceipts.set(receiptKey, {',
            '      fingerprint,',
            '      response: clone(response),',
            '    });',
            '    return clone(response);',
            '  }',
            '',
          ].join('\n');
          replaceSection(
            '  execute(command: ProtocolCommand): ProtocolResponse {',
            '  getWorkspace(',
            execute,
            'execute pre-admission',
          );

          const preAdmission = [
            '  private protocolPreAdmissionFailure(',
            '    command: ProtocolCommand,',
            "    code: RuntimeError['code'],",
            '    message: string,',
            '  ): ProtocolFailure {',
            '    return {',
            "      protocolVersion: '0.1',",
            '      ...(isProtocolEntityId(command.commandId) ? { commandId: command.commandId } : {}),',
            '      ...(isProtocolEntityId(command.correlationId)',
            '        ? { correlationId: command.correlationId }',
            '        : {}),',
            '      replayed: false,',
            '      error: {',
            '        code,',
            '        message,',
            '        retryable: false,',
            '      },',
            '    };',
            '  }',
            '',
          ].join('\n');
          replaceOnce(
            '  private protocolFailure(\n',
            preAdmission + '  private protocolFailure(\n',
            'pre-admission failure helper',
          );

          replaceOnce(
            '    this.materializeLeaseExpiry(lease);\n    return clone(lease);',
            '    this.materializeLeaseAuthority(lease);\n    return clone(lease);',
            'getLease authority materialization',
          );

          const effectiveLease = [
            '  private getEffectiveLease(taskId: string): Lease | undefined {',
            '    const leaseId = this.effectiveLeaseByTask.get(taskId);',
            '    if (!leaseId) {',
            '      return undefined;',
            '    }',
            '    const lease = this.leases.get(leaseId);',
            '    if (!lease) {',
            '      this.effectiveLeaseByTask.delete(taskId);',
            '      return undefined;',
            '    }',
            '    this.materializeLeaseAuthority(lease);',
            "    if (lease.status !== 'active') {",
            '      this.effectiveLeaseByTask.delete(taskId);',
            '      return undefined;',
            '    }',
            '    return lease;',
            '  }',
            '',
            '  private materializeLeaseAuthority(lease: Lease): void {',
            '    this.materializeLeaseExpiry(lease);',
            "    if (lease.status !== 'active') {",
            '      return;',
            '    }',
            '    const session = this.sessions.get(lease.sessionId);',
            '    if (!session || session.workspaceId !== lease.workspaceId) {',
            '      this.revokeLease(lease);',
            '      return;',
            '    }',
            '    this.materializeSessionStaleness(session);',
            "    if (session.status !== 'active' && lease.status === 'active') {",
            '      this.revokeLease(lease);',
            '    }',
            '  }',
            '',
          ].join('\n');
          replaceSection(
            '  private getEffectiveLease(taskId: string): Lease | undefined {',
            '  private materializeLeaseExpiry(',
            effectiveLease,
            'effective Lease authority',
          );

          const sessionHelpers = [
            '  private materializeSessionStaleness(session: Session): void {',
            "    if (session.status !== 'active') {",
            '      return;',
            '    }',
            '    const staleAt = Date.parse(session.lastSeenAt) + this.sessionTimeoutMs;',
            '    if (this.now().getTime() < staleAt) {',
            '      return;',
            '    }',
            '    const timestamp = this.timestamp();',
            "    session.status = 'expired';",
            '    session.revision += 1;',
            '    session.updatedAt = timestamp;',
            '    for (const lease of this.leases.values()) {',
            "      if (lease.sessionId === session.id && lease.status === 'active') {",
            '        this.revokeLease(lease, timestamp);',
            '      }',
            '    }',
            '  }',
            '',
            '  private revokeLease(lease: Lease, timestamp = this.timestamp()): void {',
            "    if (lease.status !== 'active') {",
            '      return;',
            '    }',
            "    lease.status = 'revoked';",
            '    lease.revision += 1;',
            '    lease.updatedAt = timestamp;',
            '    if (this.effectiveLeaseByTask.get(lease.taskId) === lease.id) {',
            '      this.effectiveLeaseByTask.delete(lease.taskId);',
            '    }',
            '  }',
            '',
          ].join('\n');
          replaceOnce(
            '  private requireActiveSession(workspaceId: string, sessionId: string): Session {\n',
            sessionHelpers + '  private requireActiveSession(workspaceId: string, sessionId: string): Session {\n',
            'Session liveness helpers',
          );
          replaceOnce(
            "    if (session.status !== 'active') {\n      throw new RuntimeError('SESSION_NOT_ACTIVE', `Session ${sessionId} is not active.`);\n    }\n    return session;",
            "    this.materializeSessionStaleness(session);\n    if (session.status !== 'active') {\n      throw new RuntimeError('SESSION_NOT_ACTIVE', `Session ${sessionId} is not active.`);\n    }\n    return session;",
            'active Session staleness check',
          );

          fs.writeFileSync(path, source);
          NODE

          node <<'NODE'
          const fs = require('node:fs');
          const existingTests = [
            'test/runtime/control-plane.test.ts',
            'test/runtime/control-plane-state.test.ts',
            'test/runtime/control-plane-invariants.test.ts',
            'test/runtime/control-plane-review-regressions.test.ts',
          ];
          for (const path of existingTests) {
            let source = fs.readFileSync(path, 'utf8');
            if (!source.includes('sessionTimeoutMs:')) {
              source = source.replace(
                /^(\s*)leaseDurationMs: ([^,\n]+),$/gm,
                (match, indent) => `${match}\n${indent}sessionTimeoutMs: 10 * 60_000,`,
              );
            }
            fs.writeFileSync(path, source);
          }

          const reviewPath = 'test/runtime/control-plane-pre-admission-session.test.ts';
          let review = fs.readFileSync(reviewPath, 'utf8');
          review = review.replace(
            "  } as ConstructorParameters<typeof InMemoryControlPlane>[0] & { sessionTimeoutMs: number });",
            '  });',
          );
          fs.writeFileSync(reviewPath, review);
          NODE
      - name: Format changed files
        run: pnpm prettier --write src/runtime/in-memory-control-plane.ts src/runtime/protocol.ts src/runtime/protocol-validation.ts test/runtime/control-plane*.test.ts
      - name: Verify focused GREEN
        run: pnpm vitest run test/runtime/control-plane-pre-admission-session.test.ts
      - name: Verify full repository quality
        run: pnpm check
      - name: Verify coverage
        run: pnpm test:coverage
      - name: Commit hardening and remove workflow
        shell: bash
        run: |
          rm .github/workflows/apply-pre-admission-session-hardening-once.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/runtime/in-memory-control-plane.ts src/runtime/protocol.ts src/runtime/protocol-validation.ts test/runtime/control-plane*.test.ts .github/workflows/apply-pre-admission-session-hardening-once.yml
          git commit -m "fix: enforce protocol admission and session liveness"
          git push origin HEAD:feature/local-runtime-vertical-slice
