name: Format runtime vertical slice once

on:
  push:
    branches:
      - feature/local-runtime-vertical-slice

permissions:
  contents: write

jobs:
  format:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: feature/local-runtime-vertical-slice
      - name: Install Node.js
        uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6.4.0
        with:
          node-version-file: package.json
          package-manager-cache: false
      - name: Install repository pnpm
        run: npm install --global "$(node -p "require('./package.json').packageManager")"
      - name: Install dependencies
        run: pnpm install --frozen-lockfile
      - name: Format changed files
        run: pnpm prettier --write docs/superpowers/plans/2026-08-29-local-runtime-vertical-slice.md src/runtime/in-memory-control-plane.ts test/runtime/control-plane-state.test.ts test/runtime/control-plane.test.ts
      - name: Remove one-time workflow and commit
        run: |
          rm .github/workflows/format-runtime-slice.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add docs/superpowers/plans/2026-08-29-local-runtime-vertical-slice.md src/runtime/in-memory-control-plane.ts test/runtime/control-plane-state.test.ts test/runtime/control-plane.test.ts .github/workflows/format-runtime-slice.yml
          git commit -m "style: format runtime vertical slice"
          git push origin HEAD:feature/local-runtime-vertical-slice
