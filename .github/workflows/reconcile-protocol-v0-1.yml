name: Reconcile protocol v0.1 docs

on:
  push:
    branches:
      - adr/protocol-v0-1

permissions:
  contents: write

jobs:
  reconcile:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: adr/protocol-v0-1

      - name: Install Node.js
        uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6.4.0
        with:
          node-version-file: package.json
          package-manager-cache: false

      - name: Install repository pnpm
        run: npm install --global "$(node -p "require('./package.json').packageManager")"

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Reconcile accepted ADR-0003 references
        run: |
          python3 - <<'PY'
          from pathlib import Path

          path = Path('docs/superpowers/specs/2026-08-29-control-plane-protocol-v0-1-design.md')
          text = path.read_text()

          old_dependency = '- **Depends on:** ADR-0001, proposed ADR-0003, proposed ADR-0004'
          new_dependency = '- **Depends on:** ADR-0001, ADR-0003, proposed ADR-0004'
          old_acceptance = '12. ADR-0004 remains Proposed until ADR-0003 is accepted and protocol review is complete.'
          new_acceptance = '12. ADR-0004 remains Proposed until protocol review is complete.'

          if old_dependency not in text:
              raise SystemExit('expected dependency text not found')
          if old_acceptance not in text:
              raise SystemExit('expected acceptance text not found')

          text = text.replace(old_dependency, new_dependency, 1)
          text = text.replace(old_acceptance, new_acceptance, 1)
          path.write_text(text)
          PY

      - name: Format protocol documentation
        run: pnpm exec prettier --write docs/adr/ADR-0004-control-plane-protocol-v0-1.md docs/adr/README.md docs/superpowers/specs/2026-08-29-control-plane-protocol-v0-1-design.md .github/workflows/reconcile-protocol-v0-1.yml

      - name: Full quality gate
        run: pnpm check

      - name: Commit reconciled documentation
        run: |
          git add docs/adr/ADR-0004-control-plane-protocol-v0-1.md docs/adr/README.md docs/superpowers/specs/2026-08-29-control-plane-protocol-v0-1-design.md
          if git diff --cached --quiet; then
            echo "Documentation already reconciled."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "docs: reconcile protocol with accepted domain contracts"
          git push origin HEAD:adr/protocol-v0-1
