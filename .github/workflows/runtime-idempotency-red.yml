name: Runtime protocol idempotency RED

on:
  push:
    branches:
      - feature/local-runtime-vertical-slice

permissions:
  contents: read

jobs:
  red:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Install Node.js
        uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6.4.0
        with:
          node-version-file: package.json
          package-manager-cache: false
      - name: Install repository pnpm
        run: npm install --global "$(node -p "require('./package.json').packageManager")"
      - name: Install dependencies
        run: pnpm install --frozen-lockfile
      - name: Run focused protocol idempotency test
        run: pnpm vitest run test/runtime/control-plane.test.ts -t "makes protocol commands idempotent across retries and tracing changes"
