name: Sync runtime workspace lockfile once

on:
  push:
    branches:
      - feature/local-runtime-vertical-slice

permissions:
  contents: write

jobs:
  sync:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: feature/local-runtime-vertical-slice
      - name: Install Node.js
        uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6.4.0
        with:
          node-version-file: package.json
          package-manager-cache: false
      - name: Install repository pnpm
        run: npm install --global "$(node -p "require('./package.json').packageManager")"
      - name: Sync lockfile
        run: pnpm install --lockfile-only
      - name: Remove temporary files and commit
        run: |
          rm .github/workflows/sync-runtime-lockfile.yml
          rm docs/runtime/.verification-trigger
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add pnpm-lock.yaml .github/workflows/sync-runtime-lockfile.yml docs/runtime/.verification-trigger
          git commit -m "build: link runtime to contracts workspace"
          git push origin HEAD:feature/local-runtime-vertical-slice
