name: Apply durable retry cancellation review tests once

on:
  push:
    branches:
      - feature/durable-retry-cancellation
    paths:
      - .github/workflows/apply-durable-retry-cancellation-review-tests-once.yml

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      - uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e
        with:
          node-version-file: package.json
          package-manager-cache: false
      - run: npm install --global "$(node -p "require('./package.json').packageManager")"
      - run: pnpm install --frozen-lockfile
      - run: python3 scripts/harden-durable-retry-cancellation-review.py
      - run: pnpm exec prettier --write test/application/durable-retry-cancellation.test.ts test/persistence/setup.ts test/persistence/d1-sqlite-harness.ts
      - run: git rm .github/workflows/apply-durable-retry-cancellation-review-tests-once.yml scripts/harden-durable-retry-cancellation-review.py
      - run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add test/application/durable-retry-cancellation.test.ts test/persistence/setup.ts test/persistence/d1-sqlite-harness.ts
          git commit -m "test: harden durable retry cancellation races"
          git push
      - run: pnpm vitest run test/application/durable-retry-cancellation.test.ts
