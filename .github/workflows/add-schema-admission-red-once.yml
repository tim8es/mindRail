name: Capture canonical admission RED once

on:
  push:
    branches:
      - feature/local-runtime-vertical-slice

permissions:
  contents: write

jobs:
  red:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: feature/local-runtime-vertical-slice
      - name: Install Node.js
        uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6.4.0
        with:
          node-version-file: package.json
          package-manager-cache: false
      - name: Install repository pnpm
        run: npm install --global "$(node -p "require('./package.json').packageManager")"
      - name: Install dependencies
        run: pnpm install --frozen-lockfile
      - name: Add canonical-admission regression tests
        shell: bash
        run: |
          node <<'NODE'
          const fs = require('node:fs');
          const path = 'test/runtime/control-plane-review-regressions.test.ts';
          let source = fs.readFileSync(path, 'utf8');
          source = source.replace(
            "import { InMemoryControlPlane } from '../../src/runtime/in-memory-control-plane.ts';",
            "import { RuntimeError } from '../../src/runtime/errors.ts';\nimport { InMemoryControlPlane } from '../../src/runtime/in-memory-control-plane.ts';",
          );
          const marker = '\n});\n';
          const index = source.lastIndexOf(marker);
          if (index === -1) throw new Error('Test suite closing marker not found.');
          const tests = `

  it('rejects a Goal that violates canonical schema bounds before insertion', () => {
    const runtime = createRuntime();

    expectInvalidInput(() =>
      runtime.createGoal({
        workspaceId: 'ws-1',
        title: '',
        objective: 'Canonical schema admission must run before insertion.',
        successCriteria: ['Invalid title must be rejected.'],
      }),
    );

    expect(() => runtime.getGoal('ws-1', 'goal-1')).toThrowError(RuntimeError);
  });

  it('rejects a cancellation Reason that violates canonical schema before mutation', () => {
    const runtime = createRuntime();
    const goal = runtime.createGoal({
      workspaceId: 'ws-1',
      title: 'Reason validation',
      objective: 'Reject invalid bounded Reasons before task mutation.',
      successCriteria: ['Task remains ready after invalid cancellation.'],
    });
    const task = runtime.createTask({
      workspaceId: 'ws-1',
      goalId: goal.id,
      title: 'Remain ready',
      objective: 'Do not accept an empty Reason summary.',
      acceptanceCriteria: ['Status remains ready.'],
      requiredCapabilities: [],
      dependencyTaskIds: [],
    });

    expectInvalidInput(() =>
      runtime.cancelTask({
        workspaceId: 'ws-1',
        taskId: task.id,
        expectedTaskRevision: task.revision,
        reason: { code: 'user.stop', summary: '' },
      }),
    );

    expect(runtime.getTask('ws-1', task.id).status).toBe('ready');
  });

  it('rejects Checkpoint evidence that violates canonical schema before append', () => {
    const runtime = createRuntime();
    const agent = runtime.registerAgent({
      workspaceId: 'ws-1',
      displayName: 'Worker',
      capabilities: [],
    });
    const session = runtime.startSession({ workspaceId: 'ws-1', agentId: agent.id });
    const goal = runtime.createGoal({
      workspaceId: 'ws-1',
      title: 'Evidence validation',
      objective: 'Reject malformed nested evidence before checkpoint insertion.',
      successCriteria: ['No invalid checkpoint is persisted.'],
    });
    const task = runtime.createTask({
      workspaceId: 'ws-1',
      goalId: goal.id,
      title: 'Checkpoint task',
      objective: 'Exercise checkpoint admission.',
      acceptanceCriteria: ['History stays empty after invalid evidence.'],
      requiredCapabilities: [],
      dependencyTaskIds: [],
    });
    const claim = runtime.claimTask({
      workspaceId: 'ws-1',
      taskId: task.id,
      sessionId: session.id,
      expectedTaskRevision: task.revision,
    });

    expectInvalidInput(() =>
      runtime.recordCheckpoint({
        workspaceId: 'ws-1',
        taskId: task.id,
        sessionId: session.id,
        leaseId: claim.lease.id,
        fencingToken: claim.lease.fencingToken,
        kind: 'progress',
        summary: 'Malformed evidence must be rejected.',
        evidence: [{ uri: 'evidence://ok', sha256: 'not-a-sha256' }],
        progressPercent: 10,
      }),
    );

    expect(runtime.listTaskCheckpoints('ws-1', task.id)).toHaveLength(0);
  });
`;
          source = source.slice(0, index) + tests + source.slice(index);
          source += `
function expectInvalidInput(action: () => unknown): void {
  try {
    action();
  } catch (error) {
    expect(error).toBeInstanceOf(RuntimeError);
    expect((error as RuntimeError).code).toBe('INVALID_INPUT');
    return;
  }
  throw new Error('Expected INVALID_INPUT.');
}
`;
          fs.writeFileSync(path, source);
          NODE
      - name: Observe focused RED
        shell: bash
        run: |
          set +e
          pnpm vitest run test/runtime/control-plane-review-regressions.test.ts -t "canonical schema"
          status=$?
          set -e
          if [ "$status" -eq 0 ]; then
            echo "Expected canonical admission regression tests to fail before implementation."
            exit 1
          fi
          echo "Observed expected RED exit code: $status"
      - name: Commit tests and remove one-time workflow
        shell: bash
        run: |
          rm .github/workflows/add-schema-admission-red-once.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add test/runtime/control-plane-review-regressions.test.ts .github/workflows/add-schema-admission-red-once.yml
          git commit -m "test: require canonical runtime admission"
          git push origin HEAD:feature/local-runtime-vertical-slice
