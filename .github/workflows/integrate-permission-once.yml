name: Integrate Permission Engine once

on:
  push:
    branches:
      - integration/permission-v0-1
    paths:
      - .github/workflows/integrate-permission-once.yml

permissions:
  contents: write

jobs:
  integrate:
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout integration branch
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: integration/permission-v0-1
          fetch-depth: 0
      - name: Setup Node
        uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e
        with:
          node-version-file: package.json
          package-manager-cache: false
      - name: Install pnpm
        run: npm install --global "$(node -p "require('./package.json').packageManager")"
      - name: Install dependencies
        run: pnpm install --frozen-lockfile
      - name: Apply permission integration
        run: node scripts/tmp-integrate-permission.mjs
      - name: Format
        run: pnpm exec prettier --write .
      - name: Focused permission tests
        run: pnpm vitest run test/runtime/permission-engine.test.ts test/runtime/permission-policy-fail-closed.test.ts test/runtime/control-plane-runtime-surface.test.ts test/runtime/control-plane-runtime-surface-review.test.ts
      - name: Full quality
        run: pnpm check
      - name: Coverage
        run: pnpm test:coverage
      - name: Commit verified integration
        run: |
          git rm -f .github/workflows/integrate-permission-once.yml scripts/tmp-integrate-permission.mjs
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "feat: integrate deterministic permission engine"
          git push origin HEAD:integration/permission-v0-1
