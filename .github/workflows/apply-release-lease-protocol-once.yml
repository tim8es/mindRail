name: Apply ReleaseLease protocol wiring once

on:
  push:
    branches:
      - feature/runtime-surface-v0-1
    paths:
      - .github/workflows/apply-release-lease-protocol-once.yml

permissions:
  contents: write

jobs:
  green:
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: feature/runtime-surface-v0-1

      - name: Install Node.js
        uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e
        with:
          node-version-file: package.json
          package-manager-cache: false
          check-latest: false

      - name: Install repository pnpm
        run: npm install --global "$(node -p "require('./package.json').packageManager")"

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Wire ReleaseLease into protocol
        run: |
          python - <<'PY'
          from pathlib import Path

          protocol = Path('src/runtime/protocol.ts')
          text = protocol.read_text()
          old = """export interface RenewLeaseCommand extends CommandEnvelope {
            command: 'RenewLease';
            taskId: string;
            sessionId: string;
            leaseId: string;
            fencingToken: number;
            expectedLeaseRevision: number;
          }

          export interface RecordCheckpointCommand"""
          new = """export interface RenewLeaseCommand extends CommandEnvelope {
            command: 'RenewLease';
            taskId: string;
            sessionId: string;
            leaseId: string;
            fencingToken: number;
            expectedLeaseRevision: number;
          }

          export interface ReleaseLeaseCommand extends CommandEnvelope {
            command: 'ReleaseLease';
            taskId: string;
            sessionId: string;
            leaseId: string;
            fencingToken: number;
            expectedLeaseRevision: number;
          }

          export interface RecordCheckpointCommand"""
          assert old in text
          text = text.replace(old, new, 1)
          old = """  | ClaimTaskCommand
            | RenewLeaseCommand
            | RecordCheckpointCommand"""
          new = """  | ClaimTaskCommand
            | RenewLeaseCommand
            | ReleaseLeaseCommand
            | RecordCheckpointCommand"""
          assert old in text
          protocol.write_text(text.replace(old, new, 1))

          validation = Path('src/runtime/protocol-validation.ts')
          text = validation.read_text()
          old = """  'ClaimTask',
            'RenewLease',
            'RecordCheckpoint',"""
          new = """  'ClaimTask',
            'RenewLease',
            'ReleaseLease',
            'RecordCheckpoint',"""
          assert old in text
          text = text.replace(old, new, 1)
          old = """    case 'RenewLease':
                validateExecutorFields(command, errors);
                requirePositiveInteger(command, 'expectedLeaseRevision', errors);
                return;"""
          new = """    case 'RenewLease':
              case 'ReleaseLease':
                validateExecutorFields(command, errors);
                requirePositiveInteger(command, 'expectedLeaseRevision', errors);
                return;"""
          assert old in text
          validation.write_text(text.replace(old, new, 1))

          runtime = Path('src/runtime/in-memory-control-plane.ts')
          text = runtime.read_text()
          old = """  type RecordCheckpointCommand,
            type RenewLeaseCommand,
            type ResumeTaskCommand,"""
          new = """  type RecordCheckpointCommand,
            type ReleaseLeaseCommand,
            type RenewLeaseCommand,
            type ResumeTaskCommand,"""
          assert old in text
          text = text.replace(old, new, 1)
          old = """  execute(command: ClaimTaskCommand): ProtocolResponse<ClaimTaskResult>;
            execute(command: RenewLeaseCommand): ProtocolResponse<Lease>;
            execute(command: RecordCheckpointCommand): ProtocolResponse<Checkpoint>;"""
          new = """  execute(command: ClaimTaskCommand): ProtocolResponse<ClaimTaskResult>;
            execute(command: RenewLeaseCommand): ProtocolResponse<Lease>;
            execute(command: ReleaseLeaseCommand): ProtocolResponse<Lease>;
            execute(command: RecordCheckpointCommand): ProtocolResponse<Checkpoint>;"""
          assert old in text
          text = text.replace(old, new, 1)
          old = """      case 'RenewLease':
                return this.renewLease({
                  workspaceId: command.workspaceId,
                  taskId: command.taskId,
                  sessionId: command.sessionId,
                  leaseId: command.leaseId,
                  fencingToken: command.fencingToken,
                  expectedLeaseRevision: command.expectedLeaseRevision,
                });
              case 'RecordCheckpoint':"""
          new = """      case 'RenewLease':
                return this.renewLease({
                  workspaceId: command.workspaceId,
                  taskId: command.taskId,
                  sessionId: command.sessionId,
                  leaseId: command.leaseId,
                  fencingToken: command.fencingToken,
                  expectedLeaseRevision: command.expectedLeaseRevision,
                });
              case 'ReleaseLease':
                return this.releaseLease({
                  workspaceId: command.workspaceId,
                  taskId: command.taskId,
                  sessionId: command.sessionId,
                  leaseId: command.leaseId,
                  fencingToken: command.fencingToken,
                  expectedLeaseRevision: command.expectedLeaseRevision,
                });
              case 'RecordCheckpoint':"""
          assert old in text
          runtime.write_text(text.replace(old, new, 1))
          PY

      - name: Format changed files
        run: pnpm exec prettier --write src/runtime/protocol.ts src/runtime/protocol-validation.ts src/runtime/in-memory-control-plane.ts test/runtime/control-plane-runtime-surface-review.test.ts

      - name: Verify focused GREEN
        run: pnpm vitest run test/runtime/control-plane-runtime-surface.test.ts test/runtime/control-plane-runtime-surface-review.test.ts

      - name: Verify full repository quality
        run: pnpm check

      - name: Verify coverage
        run: pnpm test:coverage

      - name: Commit fix and remove workflow
        run: |
          git rm .github/workflows/apply-release-lease-protocol-once.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/runtime/protocol.ts src/runtime/protocol-validation.ts src/runtime/in-memory-control-plane.ts test/runtime/control-plane-runtime-surface-review.test.ts
          git commit -m "fix: complete ReleaseLease protocol surface"
          git push origin HEAD:feature/runtime-surface-v0-1
