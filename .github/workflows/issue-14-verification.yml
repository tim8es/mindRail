name: Issue 14 verification

on:
  pull_request:

permissions:
  contents: write

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Checkout feature branch
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: feature/runtime-surface-v0-1

      - name: Install Node.js
        uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6.4.0
        with:
          node-version-file: package.json
          package-manager-cache: false

      - name: Install repository pnpm
        run: npm install --global "$(node -p "require('./package.json').packageManager")"

      - name: Verify toolchain
        run: |
          node --version
          pnpm --version

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Focused runtime lifecycle tests
        run: pnpm test test/runtime/control-plane-runtime-surface.test.ts

      - name: Apply exact Prettier output
        run: |
          pnpm exec prettier --write src/runtime/in-memory-control-plane.ts test/runtime/control-plane-runtime-surface.test.ts
          if git diff --quiet -- src/runtime/in-memory-control-plane.ts test/runtime/control-plane-runtime-surface.test.ts; then
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/runtime/in-memory-control-plane.ts test/runtime/control-plane-runtime-surface.test.ts
          git commit -m "style: format runtime lifecycle changes"
          git push origin HEAD:feature/runtime-surface-v0-1
