name: Apply controller authority fix once

on:
  push:
    branches:
      - feature/local-runtime-vertical-slice

permissions:
  contents: write

jobs:
  fix:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: feature/local-runtime-vertical-slice
      - name: Apply minimal authority guard
        shell: bash
        run: |
          node <<'NODE'
          const fs = require('node:fs');

          const errorsPath = 'src/runtime/errors.ts';
          let errors = fs.readFileSync(errorsPath, 'utf8');
          const errorNeedle = `  | 'IDEMPOTENCY_CONFLICT'\n  | 'SESSION_NOT_ACTIVE'`;
          const errorReplacement = `  | 'IDEMPOTENCY_CONFLICT'\n  | 'ACTOR_NOT_AUTHORIZED'\n  | 'SESSION_NOT_ACTIVE'`;
          if (!errors.includes(errorNeedle)) {
            throw new Error('Expected RuntimeErrorCode insertion point was not found.');
          }
          errors = errors.replace(errorNeedle, errorReplacement);
          fs.writeFileSync(errorsPath, errors);

          const runtimePath = 'src/runtime/in-memory-control-plane.ts';
          let runtime = fs.readFileSync(runtimePath, 'utf8');

          for (const command of ['RetryTask', 'CancelTask', 'CancelGoal']) {
            const needle = `      case '${command}':\n        return this.`;
            const replacement = `      case '${command}':\n        this.assertControllerActor(command);\n        return this.`;
            if (!runtime.includes(needle)) {
              throw new Error(`Expected ${command} dispatch case was not found.`);
            }
            runtime = runtime.replace(needle, replacement);
          }

          const helperNeedle = `  private protocolSuccess(\n`;
          const helper = `  private assertControllerActor(\n    command: RetryTaskCommand | CancelTaskCommand | CancelGoalCommand,\n  ): void {\n    if (command.actor.type === 'human' || command.actor.type === 'system') {\n      return;\n    }\n    throw new RuntimeError(\n      'ACTOR_NOT_AUTHORIZED',\n      \`Actor \${command.actor.type}:\${command.actor.id} is not authorized for \${command.command}.\`,\n    );\n  }\n\n`;
          if (!runtime.includes(helperNeedle)) {
            throw new Error('Expected protocol helper insertion point was not found.');
          }
          runtime = runtime.replace(helperNeedle, helper + helperNeedle);
          fs.writeFileSync(runtimePath, runtime);
          NODE
      - name: Commit fix and remove one-time workflow
        shell: bash
        run: |
          rm .github/workflows/fix-controller-authority-once.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/runtime/errors.ts src/runtime/in-memory-control-plane.ts .github/workflows/fix-controller-authority-once.yml
          git commit -m "fix: enforce controller actor authority"
          git push origin HEAD:feature/local-runtime-vertical-slice
