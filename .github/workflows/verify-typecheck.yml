name: Verify contract typecheck

on:
  push:
    branches:
      - adr/domain-contracts

permissions:
  contents: read

jobs:
  typecheck:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Install Node.js
        uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6.4.0
        with:
          node-version-file: package.json
          package-manager-cache: false

      - name: Install repository pnpm
        run: npm install --global "$(node -p "require('./package.json').packageManager")"

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Diagnose declaration and interop boundaries
        run: |
          set +e
          pnpm exec tsc -p tsconfig.base.json --skipLibCheck
          skip_only=$?
          echo "skip_lib_check_only_status=$skip_only"

          pnpm exec tsc -p tsconfig.base.json --skipLibCheck --esModuleInterop
          interop=$?
          echo "skip_lib_check_plus_interop_status=$interop"

          test "$skip_only" -ne 0
          test "$interop" -eq 0
