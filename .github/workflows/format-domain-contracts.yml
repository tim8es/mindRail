name: Format domain contracts

on:
  push:
    branches:
      - adr/domain-contracts

permissions:
  contents: write

jobs:
  format:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: adr/domain-contracts

      - name: Install Node.js
        uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6.4.0
        with:
          node-version-file: package.json
          package-manager-cache: false

      - name: Install repository pnpm
        run: npm install --global "$(node -p "require('./package.json').packageManager")"

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Format design files
        run: >-
          pnpm exec prettier --write
          docs/adr/ADR-0003-domain-contracts-and-schema-authority.md
          docs/superpowers/specs/2026-08-29-domain-contracts-design.md

      - name: Commit formatting
        run: |
          git add docs/adr/ADR-0003-domain-contracts-and-schema-authority.md \
                  docs/superpowers/specs/2026-08-29-domain-contracts-design.md
          if git diff --cached --quiet; then
            echo "Formatting already current."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "style: format domain contract design"
          git push origin HEAD:adr/domain-contracts
