name: Verify schema RED

on:
  push:
    branches:
      - adr/domain-contracts

permissions:
  contents: read

jobs:
  red:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Install Node.js
        uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6.4.0
        with:
          node-version-file: package.json
          package-manager-cache: false

      - name: Install repository pnpm
        run: npm install --global "$(node -p "require('./package.json').packageManager")"

      - name: Install dependencies for focused RED verification
        run: pnpm install --no-frozen-lockfile

      - name: Run schema compilation contract
        run: pnpm vitest run packages/contracts/test/schema-compilation.test.ts
