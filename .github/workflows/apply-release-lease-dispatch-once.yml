name: Apply ReleaseLease dispatch once

on:
  push:
    branches:
      - feature/runtime-surface-v0-1
    paths:
      - .github/workflows/apply-release-lease-dispatch-once.yml

permissions:
  contents: write

jobs:
  green:
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: feature/runtime-surface-v0-1

      - name: Install Node.js
        uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e
        with:
          node-version-file: package.json
          package-manager-cache: false
          check-latest: false

      - name: Install repository pnpm
        run: npm install --global "$(node -p "require('./package.json').packageManager")"

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Add ReleaseLease dispatcher wiring
        run: |
          python - <<'PY'
          from pathlib import Path
          path = Path('src/runtime/in-memory-control-plane.ts')
          text = path.read_text()

          old = "  type RecordCheckpointCommand,\n  type RenewLeaseCommand,\n  type ResumeTaskCommand,"
          new = "  type RecordCheckpointCommand,\n  type ReleaseLeaseCommand,\n  type RenewLeaseCommand,\n  type ResumeTaskCommand,"
          assert old in text
          text = text.replace(old, new, 1)

          old = "  execute(command: ClaimTaskCommand): ProtocolResponse<ClaimTaskResult>;\n  execute(command: RenewLeaseCommand): ProtocolResponse<Lease>;\n  execute(command: RecordCheckpointCommand): ProtocolResponse<Checkpoint>;"
          new = "  execute(command: ClaimTaskCommand): ProtocolResponse<ClaimTaskResult>;\n  execute(command: RenewLeaseCommand): ProtocolResponse<Lease>;\n  execute(command: ReleaseLeaseCommand): ProtocolResponse<Lease>;\n  execute(command: RecordCheckpointCommand): ProtocolResponse<Checkpoint>;"
          assert old in text
          text = text.replace(old, new, 1)

          anchor = "      case 'RecordCheckpoint':\n"
          assert anchor in text
          release = """      case 'ReleaseLease':
        return this.releaseLease({
          workspaceId: command.workspaceId,
          taskId: command.taskId,
          sessionId: command.sessionId,
          leaseId: command.leaseId,
          fencingToken: command.fencingToken,
          expectedLeaseRevision: command.expectedLeaseRevision,
        });
"""
          text = text.replace(anchor, release + anchor, 1)
          path.write_text(text)
          PY

      - name: Format
        run: pnpm exec prettier --write src/runtime/in-memory-control-plane.ts src/runtime/protocol.ts src/runtime/protocol-validation.ts test/runtime/control-plane-runtime-surface-review.test.ts

      - name: Verify focused GREEN
        run: pnpm vitest run test/runtime/control-plane-runtime-surface.test.ts test/runtime/control-plane-runtime-surface-review.test.ts

      - name: Verify repository
        run: pnpm check

      - name: Verify coverage
        run: pnpm test:coverage

      - name: Commit and self-delete
        run: |
          git rm .github/workflows/apply-release-lease-dispatch-once.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/runtime/in-memory-control-plane.ts src/runtime/protocol.ts src/runtime/protocol-validation.ts test/runtime/control-plane-runtime-surface-review.test.ts
          git commit -m "fix: complete ReleaseLease protocol surface"
          git push origin HEAD:feature/runtime-surface-v0-1
