name: Durable Task 4 once

on:
  push:
    branches:
      - feature/durable-application-composition

permissions:
  contents: write

jobs:
  implement:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: feature/durable-application-composition
      - uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e
        with:
          node-version-file: package.json
          package-manager-cache: false
      - run: npm install --global "$(node -p "require('./package.json').packageManager")"
      - run: pnpm install --frozen-lockfile
      - name: Apply Task 4 durable query support
        run: |
          python <<'PY'
          from pathlib import Path

          d1 = Path('src/persistence/cloudflare/d1-runtime-persistence.ts')
          text = d1.read_text()
          for name in ['getWorkspace', 'getGoal', 'getTask', 'getAgent', 'getSession', 'getLease']:
              old = f'  private async {name}('
              new = f'  async {name}('
              if old not in text:
                  raise SystemExit(f'missing visibility anchor: {old}')
              text = text.replace(old, new, 1)

          anchor = '''  async loadWorkspaceState(workspaceId: string): Promise<WorkspaceStateSnapshot | undefined> {\n'''
          addition = '''  async getPermissionRequest(\n    workspaceId: string,\n    requestId: string,\n  ): Promise<PermissionRequest | undefined> {\n    return this.readRecord<PermissionRequest>(\n      `SELECT record_json FROM permission_requests WHERE workspace_id = ? AND id = ?`,\n      workspaceId,\n      requestId,\n    );\n  }\n\n'''
          if anchor not in text:
              raise SystemExit('missing loadWorkspaceState anchor')
          text = text.replace(anchor, addition + anchor, 1)

          old = '''  async listTaskCheckpoints(workspaceId: string, taskId: string): Promise<Checkpoint[]> {\n    return this.readRecords<Checkpoint>(\n      `SELECT record_json FROM checkpoints\n       WHERE workspace_id = ? AND task_id = ? ORDER BY created_at_ms, id`,\n      workspaceId,\n      taskId,\n    );\n  }\n'''
          new = '''  async listClaimableTasks(\n    workspaceId: string,\n    sessionId: string,\n    limit: number,\n    offset = 0,\n  ): Promise<Task[]> {\n    const session = await this.getSession(workspaceId, sessionId);\n    if (!session) throw new PersistenceError('NOT_FOUND', `Session ${sessionId} was not found.`);\n    if (session.status !== 'active') {\n      throw new PersistenceError('CONFLICT', `Session ${sessionId} is not active.`);\n    }\n    const agent = await this.getAgent(workspaceId, session.agentId);\n    if (!agent || agent.status !== 'active') {\n      throw new PersistenceError('CONFLICT', `Agent ${session.agentId} is not active.`);\n    }\n    return this.readRecords<Task>(\n      `SELECT t.record_json\n       FROM tasks t\n       WHERE t.workspace_id = ? AND t.status = 'ready'\n         AND NOT EXISTS (\n           SELECT 1\n           FROM task_required_capabilities trc\n           WHERE trc.workspace_id = t.workspace_id AND trc.task_id = t.id\n             AND NOT EXISTS (\n               SELECT 1\n               FROM agent_capabilities ac\n               WHERE ac.workspace_id = t.workspace_id\n                 AND ac.agent_id = ?\n                 AND ac.capability = trc.capability\n             )\n         )\n       ORDER BY t.created_at_ms, t.id\n       LIMIT ? OFFSET ?`,\n      workspaceId,\n      agent.id,\n      boundedLimit(limit),\n      boundedOffset(offset),\n    );\n  }\n\n  async listTaskCheckpoints(\n    workspaceId: string,\n    taskId: string,\n    limit?: number,\n    offset = 0,\n  ): Promise<Checkpoint[]> {\n    if (limit === undefined) {\n      return this.readRecords<Checkpoint>(\n        `SELECT record_json FROM checkpoints\n         WHERE workspace_id = ? AND task_id = ? ORDER BY created_at_ms, id`,\n        workspaceId,\n        taskId,\n      );\n    }\n    return this.readRecords<Checkpoint>(\n      `SELECT record_json FROM checkpoints\n       WHERE workspace_id = ? AND task_id = ? ORDER BY created_at_ms, id LIMIT ? OFFSET ?`,\n      workspaceId,\n      taskId,\n      boundedLimit(limit),\n      boundedOffset(offset),\n    );\n  }\n'''
          if old not in text:
              raise SystemExit('missing listTaskCheckpoints anchor')
          text = text.replace(old, new, 1)

          old = '''  async listPermissionDecisions(\n    workspaceId: string,\n    requestId: string,\n  ): Promise<PermissionDecision[]> {\n    return this.readRecords<PermissionDecision>(\n      `SELECT record_json FROM permission_decisions\n       WHERE workspace_id = ? AND request_id = ? ORDER BY sequence, created_at_ms, id`,\n      workspaceId,\n      requestId,\n    );\n  }\n'''
          new = '''  async listPermissionDecisions(\n    workspaceId: string,\n    requestId: string,\n    limit?: number,\n    offset = 0,\n  ): Promise<PermissionDecision[]> {\n    if (limit === undefined) {\n      return this.readRecords<PermissionDecision>(\n        `SELECT record_json FROM permission_decisions\n         WHERE workspace_id = ? AND request_id = ? ORDER BY sequence, created_at_ms, id`,\n        workspaceId,\n        requestId,\n      );\n    }\n    return this.readRecords<PermissionDecision>(\n      `SELECT record_json FROM permission_decisions\n       WHERE workspace_id = ? AND request_id = ?\n       ORDER BY sequence, created_at_ms, id LIMIT ? OFFSET ?`,\n      workspaceId,\n      requestId,\n      boundedLimit(limit),\n      boundedOffset(offset),\n    );\n  }\n'''
          if old not in text:
              raise SystemExit('missing listPermissionDecisions anchor')
          text = text.replace(old, new, 1)

          old = '''  async listPendingHumanPermissions(\n    workspaceId: string,\n    limit: number,\n  ): Promise<PendingHumanPermission[]> {\n'''
          new = '''  async listPendingHumanPermissions(\n    workspaceId: string,\n    limit: number,\n    offset = 0,\n  ): Promise<PendingHumanPermission[]> {\n'''
          if old not in text:
              raise SystemExit('missing pending permissions signature')
          text = text.replace(old, new, 1)
          old = '''       ORDER BY pr.created_at_ms, pr.id\n       LIMIT ?`,\n      workspaceId,\n      boundedLimit(limit),\n'''
          new = '''       ORDER BY pr.created_at_ms, pr.id\n       LIMIT ? OFFSET ?`,\n      workspaceId,\n      boundedLimit(limit),\n      boundedOffset(offset),\n'''
          if old not in text:
              raise SystemExit('missing pending permissions pagination anchor')
          text = text.replace(old, new, 1)

          anchor = '''function changes(result: D1ResultLike): number {\n'''
          addition = '''function boundedOffset(offset: number): number {\n  if (!Number.isSafeInteger(offset) || offset < 0 || offset > 1_000_000) {\n    throw new PersistenceError('INVALID_RECORD', 'Query offset must be a bounded non-negative integer.');\n  }\n  return offset;\n}\n\n'''
          if anchor not in text:
              raise SystemExit('missing changes helper anchor')
          text = text.replace(anchor, addition + anchor, 1)
          d1.write_text(text)

          dispatcher = Path('src/application/durable-dispatcher.ts')
          text = dispatcher.read_text()
          text = text.replace(
              '''  type MutationCommitResult,\n  type StoredCommandReceipt,\n''',
              '''  type MutationCommitResult,\n  type PendingHumanPermission,\n  type StoredCommandReceipt,\n''',
              1,
          )
          text = text.replace(
              '''  QueryFailure,\n} from './protocol.ts';\n''',
              '''  QueryFailure,\n  QueryResponse,\n} from './protocol.ts';\n''',
              1,
          )
          old = '''    dispatchQuery(query) {\n      return unsupportedQuery(query);\n    },\n'''
          new = '''    dispatchQuery(query) {\n      return dispatchDurableQuery(options, query);\n    },\n'''
          if old not in text:
              raise SystemExit('missing durable dispatchQuery anchor')
          text = text.replace(old, new, 1)

          anchor = '''function isFirstDurableLoopCommand(command: ProtocolCommand): boolean {\n'''
          addition = r'''async function dispatchDurableQuery(
  options: DurableApplicationDispatcherOptions,
  query: ApplicationQuery,
): Promise<QueryResponse> {
  try {
    switch (query.query) {
      case 'GetWorkspace':
        return durableResourceQuery(query, await options.persistence.getWorkspace(query.workspaceId));
      case 'GetGoal':
        return durableResourceQuery(
          query,
          await options.persistence.getGoal(query.workspaceId, query.goalId),
        );
      case 'GetTask':
        return durableResourceQuery(
          query,
          await options.persistence.getTask(query.workspaceId, query.taskId),
        );
      case 'GetAgent':
        return durableResourceQuery(
          query,
          await options.persistence.getAgent(query.workspaceId, query.agentId),
        );
      case 'GetSession':
        return durableResourceQuery(
          query,
          await options.persistence.getSession(query.workspaceId, query.sessionId),
        );
      case 'GetLease':
        return durableResourceQuery(
          query,
          await options.persistence.getLease(query.workspaceId, query.leaseId),
        );
      case 'GetPermissionRequest':
        return durableResourceQuery(
          query,
          await options.persistence.getPermissionRequest(query.workspaceId, query.requestId),
        );
      case 'ListTaskCheckpoints': {
        if (!(await options.persistence.getTask(query.workspaceId, query.taskId))) {
          return queryFailure(query, 'NOT_FOUND', 'Durable Task was not found.');
        }
        const window = listWindow(query.limit, query.cursor);
        if (!window) return invalidListWindow(query);
        const rows = await options.persistence.listTaskCheckpoints(
          query.workspaceId,
          query.taskId,
          window.limit + 1,
          window.offset,
        );
        return querySuccess(query, pageRows(rows, window.limit, window.offset));
      }
      case 'ListPermissionDecisions': {
        if (!(await options.persistence.getPermissionRequest(query.workspaceId, query.requestId))) {
          return queryFailure(query, 'NOT_FOUND', 'Durable PermissionRequest was not found.');
        }
        const window = listWindow(query.limit, query.cursor);
        if (!window) return invalidListWindow(query);
        const rows = await options.persistence.listPermissionDecisions(
          query.workspaceId,
          query.requestId,
          window.limit + 1,
          window.offset,
        );
        return querySuccess(query, pageRows(rows, window.limit, window.offset));
      }
      case 'ListPendingHumanPermissions': {
        if (!(await options.persistence.getWorkspace(query.workspaceId))) {
          return queryFailure(query, 'NOT_FOUND', 'Durable Workspace was not found.');
        }
        const window = listWindow(query.limit, query.cursor);
        if (!window) return invalidListWindow(query);
        const rows = await options.persistence.listPendingHumanPermissions(
          query.workspaceId,
          window.limit + 1,
          window.offset,
        );
        return querySuccess(query, pageRows(rows, window.limit, window.offset));
      }
      case 'ListClaimableTasks': {
        if (!(await options.persistence.getWorkspace(query.workspaceId))) {
          return queryFailure(query, 'NOT_FOUND', 'Durable Workspace was not found.');
        }
        const session = await options.persistence.getSession(query.workspaceId, query.sessionId);
        if (!session) return queryFailure(query, 'NOT_FOUND', 'Durable Session was not found.');
        const staleAt = Date.parse(session.lastSeenAt) + options.sessionTimeoutMs;
        if (session.status !== 'active' || options.now().getTime() >= staleAt) {
          return queryFailure(query, 'SESSION_NOT_ACTIVE', 'Session is not active for work acquisition.');
        }
        const window = listWindow(query.limit, query.cursor);
        if (!window) return invalidListWindow(query);
        const rows = await options.persistence.listClaimableTasks(
          query.workspaceId,
          query.sessionId,
          window.limit + 1,
          window.offset,
        );
        return querySuccess(query, pageRows(rows, window.limit, window.offset));
      }
      case 'ListGoals':
      case 'ListGoalTasks':
      case 'GetTaskExecutionView':
        return unsupportedQuery(query);
    }
  } catch (error) {
    if (error instanceof PersistenceError) return persistenceQueryFailure(query, error);
    return queryFailure(query, 'INTERNAL_ERROR', 'Durable query execution failed.');
  }
}

'''
          if anchor not in text:
              raise SystemExit('missing durable query insertion anchor')
          text = text.replace(anchor, addition + anchor, 1)

          old = r'''function unsupportedQuery(query: ApplicationQuery): QueryFailure {
  return {
    protocolVersion: '0.1',
    ...(query.correlationId === undefined ? {} : { correlationId: query.correlationId }),
    error: {
      code: 'UNSUPPORTED_OPERATION',
      message: `${query.query} is not yet integrated in the durable application composition.`,
      retryable: false,
    },
  };
}
'''
          new = r'''function unsupportedQuery(query: ApplicationQuery): QueryFailure {
  return queryFailure(
    query,
    'UNSUPPORTED_OPERATION',
    `${query.query} is not yet integrated in the durable application composition.`,
  );
}

function querySuccess<T>(query: ApplicationQuery, result: T): QueryResponse<T> {
  return {
    protocolVersion: '0.1',
    ...(query.correlationId === undefined ? {} : { correlationId: query.correlationId }),
    result: structuredClone(result),
  };
}

function queryFailure(
  query: ApplicationQuery,
  code: ApplicationErrorCode,
  message: string,
): QueryFailure {
  return {
    protocolVersion: '0.1',
    ...(query.correlationId === undefined ? {} : { correlationId: query.correlationId }),
    error: { code, message, retryable: false },
  };
}

function durableResourceQuery<T>(query: ApplicationQuery, value: T | undefined): QueryResponse<T> {
  return value === undefined
    ? queryFailure(query, 'NOT_FOUND', 'Durable resource was not found.')
    : querySuccess(query, value);
}

function persistenceQueryFailure(query: ApplicationQuery, error: PersistenceError): QueryFailure {
  switch (error.code) {
    case 'NOT_FOUND':
      return queryFailure(query, 'NOT_FOUND', 'Durable resource was not found.');
    case 'CONFLICT':
      return queryFailure(query, 'CONFLICT', 'Durable state conflicts with this query.');
    case 'REVISION_MISMATCH':
      return queryFailure(query, 'REVISION_MISMATCH', 'Durable revision changed.');
    case 'STALE_AUTHORITY':
      return queryFailure(query, 'STALE_FENCING_TOKEN', 'Durable execution authority is stale.');
    case 'IDEMPOTENCY_CONFLICT':
      return queryFailure(query, 'IDEMPOTENCY_CONFLICT', 'Durable command identity conflicts.');
    case 'INVALID_STATE_TRANSITION':
      return queryFailure(query, 'INVALID_STATE_TRANSITION', 'Durable state transition is invalid.');
    case 'INVALID_RECORD':
      return queryFailure(query, 'INVALID_INPUT', 'Durable query bounds are invalid.');
    case 'INTEGRITY_ERROR':
      return queryFailure(query, 'INTERNAL_ERROR', 'Durable state integrity check failed.');
  }
}

function listWindow(limit: number, cursor: string | undefined): { limit: number; offset: number } | undefined {
  if (!Number.isSafeInteger(limit) || limit < 1 || limit > 100) return undefined;
  if (cursor === undefined) return { limit, offset: 0 };
  const match = /^c([0-9]+)$/.exec(cursor);
  if (match?.[1] === undefined) return undefined;
  const offset = Number(match[1]);
  if (!Number.isSafeInteger(offset) || offset < 0 || offset > 1_000_000) return undefined;
  return { limit, offset };
}

function invalidListWindow(query: ApplicationQuery): QueryFailure {
  return queryFailure(query, 'INVALID_INPUT', 'List limit or cursor is invalid.');
}

function pageRows<T>(rows: T[], limit: number, offset: number): { items: T[]; nextCursor?: string } {
  const items = rows.slice(0, limit);
  return {
    items,
    ...(rows.length > limit ? { nextCursor: `c${offset + limit}` } : {}),
  };
}
'''
          if old not in text:
              raise SystemExit('missing unsupportedQuery anchor')
          text = text.replace(old, new, 1)
          dispatcher.write_text(text)
          PY
      - run: pnpm exec prettier --write src/persistence/ports.ts src/persistence/cloudflare/d1-runtime-persistence.ts src/application/durable-dispatcher.ts
      - name: Focused durable query verification
        run: pnpm exec vitest run test/application/durable-queries.test.ts test/application/durable-dispatcher.test.ts test/persistence/d1-runtime-persistence.test.ts test/persistence/d1-runtime-persistence-invariants.test.ts
      - run: git rm .github/workflows/durable-task4-once.yml
      - run: pnpm check
      - run: pnpm test:coverage
      - name: Commit and push Task 4
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/persistence/ports.ts src/persistence/cloudflare/d1-runtime-persistence.ts src/application/durable-dispatcher.ts test/application/durable-queries.test.ts
          git commit -m "feat: expose durable application queries"
          git push origin HEAD:feature/durable-application-composition
