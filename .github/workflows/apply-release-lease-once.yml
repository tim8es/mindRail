name: Apply ReleaseLease once

on:
  push:
    branches:
      - feature/runtime-surface-v0-1

permissions:
  contents: write

jobs:
  green:
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: feature/runtime-surface-v0-1
      - name: Setup Node
        uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e
        with:
          node-version-file: package.json
          package-manager-cache: false
      - name: Install pnpm
        run: npm install --global "$(node -p "require('./package.json').packageManager")"
      - name: Install dependencies
        run: pnpm install --frozen-lockfile
      - name: Apply patch
        run: node scripts/tmp-release-lease-patch.mjs
      - name: Format
        run: pnpm exec prettier --write src/runtime/in-memory-control-plane.ts src/runtime/protocol.ts src/runtime/protocol-validation.ts test/runtime/control-plane-runtime-surface-review.test.ts
      - name: Focused tests
        run: pnpm vitest run test/runtime/control-plane-runtime-surface.test.ts test/runtime/control-plane-runtime-surface-review.test.ts
      - name: Full quality
        run: pnpm check
      - name: Coverage
        run: pnpm test:coverage
      - name: Commit verified fix
        run: |
          git rm .github/workflows/apply-release-lease-once.yml scripts/tmp-release-lease-patch.mjs
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/runtime/in-memory-control-plane.ts src/runtime/protocol.ts src/runtime/protocol-validation.ts test/runtime/control-plane-runtime-surface-review.test.ts
          git commit -m "fix: complete ReleaseLease protocol surface"
          git push origin HEAD:feature/runtime-surface-v0-1
