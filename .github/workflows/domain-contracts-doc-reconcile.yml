name: Domain contracts documentation reconciliation

on:
  push:
    branches:
      - adr/domain-contracts
    paths:
      - .github/workflows/domain-contracts-doc-reconcile.yml

permissions:
  contents: write

jobs:
  reconcile:
    if: github.ref_name == 'adr/domain-contracts'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Checkout branch
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: adr/domain-contracts

      - name: Reconcile large implementation records
        run: |
          python3 - <<'PY'
          from pathlib import Path

          spec = Path('docs/superpowers/specs/2026-08-29-domain-contracts-design.md')
          text = spec.read_text()
          text = text.replace('- **Status:** Written review pending', '- **Status:** Approved / implemented', 1)
          text = text.replace('- **Depends on:** ADR-0001, proposed ADR-0003', '- **Depends on:** ADR-0001, ADR-0003', 1)
          spec.write_text(text)

          plan = Path('docs/superpowers/plans/2026-08-29-domain-contracts.md')
          text = plan.read_text()
          marker = '## Exit Condition\n'
          evidence = '''## Finalization evidence — 2026-08-29\n\nThe implemented slice was reconciled against current repository state rather than the original plan summary. Executed GitHub Actions verification run `33251135323` on branch commit `a7d13afa265589d91f0754f98c19301482bfffe9` established:\n\n- `pnpm install --frozen-lockfile` PASS; pnpm reported 188 lockfile entries passing supply-chain policy checks;\n- `pnpm format:check` PASS;\n- `pnpm lint` PASS;\n- `pnpm typecheck` PASS;\n- `pnpm contracts:check-generated` PASS;\n- `pnpm test` PASS with 5/5 test files and 10/10 tests;\n- `pnpm check` PASS;\n- `pnpm test:coverage` PASS with 100% statements/branches/functions/lines for files instrumented by the current suite;\n- `@mindrail/contracts` has zero runtime dependencies and contract schema/generation tooling is root dev-only;\n- all 10 v1 top-level entity schemas set `additionalProperties: false`;\n- an intentional stale edit to generated `workspace.ts` caused `contracts:check-generated` to fail with `Generated contracts are stale: workspace.ts`; restoration made the check pass again and left `git diff --exit-code` clean.\n\nRoot-cause verification also showed that Ajv CommonJS interop needed an explicit `createRequire` type boundary under NodeNext. Removing `skipLibCheck` then exposed a TypeScript 6 incompatibility only in `@apidevtools/json-schema-ref-parser@11.9.3` declarations, so the setting remains limited to third-party declaration checking rather than hiding first-party errors.\n\nThe permanent read-only `Quality` workflow is re-run on the eventual final documentation HEAD; that final run id is recorded in PR #4 rather than embedded here because adding it to this file would itself create a new HEAD.\n\n'''
          if '## Finalization evidence — 2026-08-29' not in text:
              text = text.replace(marker, evidence + marker, 1)
          plan.write_text(text)
          PY

      - name: Remove temporary workflow and commit
        run: |
          rm .github/workflows/domain-contracts-doc-reconcile.yml
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add docs/superpowers/specs/2026-08-29-domain-contracts-design.md docs/superpowers/plans/2026-08-29-domain-contracts.md .github/workflows/domain-contracts-doc-reconcile.yml
          git diff --cached --check
          git commit -m 'docs: finalize domain contracts implementation record'
          git push origin HEAD:adr/domain-contracts
