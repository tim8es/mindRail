name: Permission Engine TDD

on:
  push:
    branches:
      - feature/permission-engine-v0-1

permissions:
  contents: read

concurrency:
  group: permission-engine-tdd-${{ github.ref }}
  cancel-in-progress: true

jobs:
  tdd:
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Install Node.js
        uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6.4.0
        with:
          node-version-file: package.json
          package-manager-cache: false

      - name: Install repository pnpm
        run: npm install --global "$(node -p "require('./package.json').packageManager")"

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Focused permission regressions
        run: pnpm exec vitest run test/runtime/permission-engine.test.ts test/runtime/permission-policy-fail-closed.test.ts

      - name: Full quality gate
        run: pnpm check

      - name: Coverage
        run: pnpm test:coverage
