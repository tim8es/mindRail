name: Integrate bootstrap commands once

on:
  push:
    branches:
      - feature/bootstrap-e2e-v0-1
    paths:
      - scripts/tmp-bootstrap-integrate.mjs
      - .github/workflows/bootstrap-integrate-once.yml

permissions:
  contents: write

jobs:
  integrate:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: feature/bootstrap-e2e-v0-1
          fetch-depth: 0
      - name: Install Node.js
        uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e
        with:
          node-version-file: package.json
          package-manager-cache: false
      - name: Install repository pnpm
        run: npm install --global "$(node -p "require('./package.json').packageManager")"
      - name: Install dependencies
        run: pnpm install --frozen-lockfile
      - name: Apply bootstrap integration
        run: node scripts/tmp-bootstrap-integrate.mjs
      - name: Format changed files
        run: pnpm exec prettier --write src/runtime/protocol.ts src/runtime/protocol-validation.ts src/runtime/in-memory-control-plane.ts src/application/protocol.ts src/application/validation.ts src/application/in-memory-dispatcher.ts test/runtime/bootstrap-protocol.test.ts test/transports/review-regressions.test.ts
      - name: Focused bootstrap and transport tests
        run: pnpm vitest run test/runtime/bootstrap-protocol.test.ts test/transports/review-regressions.test.ts test/transports/http-adapter.test.ts test/transports/mcp-adapter.test.ts
      - name: Remove temporary integration harness
        run: git rm -f .github/workflows/bootstrap-e2e-red.yml .github/workflows/bootstrap-integrate-once.yml scripts/tmp-bootstrap-integrate.mjs
      - name: Full quality on final Task 1 tree
        run: pnpm check
      - name: Commit verified bootstrap protocol
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/runtime src/application test/runtime/bootstrap-protocol.test.ts test/transports/review-regressions.test.ts docs/superpowers/plans/2026-08-29-bootstrap-application-e2e.md
          git commit -m "feat: add canonical agent bootstrap commands"
          git push origin HEAD:feature/bootstrap-e2e-v0-1
