name: Apply durable retry cancellation GREEN once

on:
  push:
    branches:
      - feature/durable-retry-cancellation

permissions:
  contents: write

jobs:
  apply:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: feature/durable-retry-cancellation
      - uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e
        with:
          node-version-file: package.json
          package-manager-cache: false
      - run: npm install --global "$(node -p "require('./package.json').packageManager")"
      - run: pnpm install --frozen-lockfile
      - run: python3 scripts/apply-durable-retry-cancellation-green.py
      - run: pnpm exec prettier --write src/application/durable-dispatcher.ts src/persistence/ports.ts src/persistence/cloudflare/d1-runtime-persistence.ts
      - run: git rm .github/workflows/apply-durable-retry-cancellation-green-once.yml scripts/apply-durable-retry-cancellation-green.py
      - run: pnpm vitest run test/application/durable-retry-cancellation.test.ts
      - run: pnpm check
      - run: pnpm test:coverage
      - run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/application/durable-dispatcher.ts src/persistence/ports.ts src/persistence/cloudflare/d1-runtime-persistence.ts
          git commit -m "feat: add durable retry cancellation"
          git push origin HEAD:feature/durable-retry-cancellation
