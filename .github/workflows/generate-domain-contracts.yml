name: Generate domain contracts

on:
  push:
    branches:
      - adr/domain-contracts

permissions:
  contents: write

jobs:
  generate:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: adr/domain-contracts

      - name: Install Node.js
        uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6.4.0
        with:
          node-version-file: package.json
          package-manager-cache: false

      - name: Install repository pnpm
        run: npm install --global "$(node -p "require('./package.json').packageManager")"

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Verify canonical schemas and fixtures
        run: >-
          pnpm vitest run
          packages/contracts/test/schema-compilation.test.ts
          packages/contracts/test/fixtures.test.ts

      - name: Generate TypeScript bindings
        run: pnpm contracts:generate

      - name: Verify generated bindings
        run: pnpm vitest run packages/contracts/test/generated.test.ts

      - name: Commit generated output
        run: |
          git add packages/contracts/src/generated/v1
          if git diff --cached --quiet; then
            echo "Generated output already current."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "feat: generate TypeScript domain bindings"
          git push origin HEAD:adr/domain-contracts
