name: Reconcile durable task outcomes docs once

on:
  push:
    branches:
      - feature/durable-task-outcomes

permissions:
  contents: write

jobs:
  reconcile:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: feature/durable-task-outcomes
      - uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e
        with:
          node-version-file: package.json
          package-manager-cache: false
      - run: npm install --global "$(node -p "require('./package.json').packageManager")"
      - run: pnpm install --frozen-lockfile
      - run: python3 scripts/reconcile-durable-task-outcomes-docs.py
      - run: pnpm exec prettier --write docs/CURRENT_STATE.md docs/roadmap/V0_1.md CHANGELOG.md
      - run: git rm .github/workflows/reconcile-durable-task-outcomes-docs-once.yml scripts/reconcile-durable-task-outcomes-docs.py
      - run: pnpm check
      - run: pnpm test:coverage
      - run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add docs/CURRENT_STATE.md docs/roadmap/V0_1.md CHANGELOG.md
          git commit -m "docs: reconcile durable task outcomes"
          git push origin HEAD:feature/durable-task-outcomes
