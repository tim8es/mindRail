name: Durable finalize once

on:
  push:
    branches:
      - feature/durable-application-composition

permissions:
  contents: write

jobs:
  finalize:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: feature/durable-application-composition
      - uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e
        with:
          node-version-file: package.json
          package-manager-cache: false
      - run: npm install --global "$(node -p "require('./package.json').packageManager")"
      - run: pnpm install --frozen-lockfile
      - name: Apply finalization
        run: python scripts/tmp/durable-finalize.py
      - name: Format final tree
        run: pnpm exec prettier --write src/application/durable-dispatcher.ts docs/CURRENT_STATE.md docs/roadmap/V0_1.md CHANGELOG.md
      - name: Remove temporary harness
        run: git rm .github/workflows/durable-finalize-once.yml scripts/tmp/durable-finalize.py
      - name: Full check
        run: pnpm check
      - name: Coverage
        run: pnpm test:coverage
      - name: Commit and push final tree
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/application/durable-dispatcher.ts docs/CURRENT_STATE.md docs/roadmap/V0_1.md CHANGELOG.md
          git commit -m "docs: finalize durable application evidence"
          git push origin HEAD:feature/durable-application-composition
