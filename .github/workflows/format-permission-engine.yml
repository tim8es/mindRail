name: Format Permission Engine

on:
  push:
    branches:
      - feature/permission-engine-v0-1

permissions:
  contents: write

jobs:
  format:
    runs-on: ubuntu-latest
    timeout-minutes: 5

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Install Node.js
        uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6.4.0
        with:
          node-version-file: package.json
          package-manager-cache: false

      - name: Install repository pnpm
        run: npm install --global "$(node -p "require('./package.json').packageManager")"

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Format permission files
        run: pnpm exec prettier --write src/runtime/permission-service.ts src/runtime/protocol-validation.ts test/runtime/permission-engine.test.ts

      - name: Remove temporary formatter workflow
        run: rm .github/workflows/format-permission-engine.yml

      - name: Commit formatting
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/runtime/permission-service.ts src/runtime/protocol-validation.ts test/runtime/permission-engine.test.ts .github/workflows/format-permission-engine.yml
          git commit -m "style: format permission engine implementation"
          git push origin HEAD:feature/permission-engine-v0-1
