name: Transport review RED

on:
  push:
    branches:
      - integration/transports-v0-1
    paths:
      - .github/workflows/transport-review-red.yml

permissions:
  contents: read

jobs:
  red:
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: integration/transports-v0-1
          fetch-depth: 0
      - name: Setup Node
        uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e
        with:
          node-version-file: package.json
          package-manager-cache: false
      - name: Install pnpm
        run: npm install --global "$(node -p "require('./package.json').packageManager")"
      - name: Install dependencies
        run: pnpm install --frozen-lockfile
      - name: Materialize transport candidate
        run: |
          git fetch origin feature/transports-v0-1
          git checkout origin/feature/transports-v0-1 -- src/application src/transports test/transports
          pnpm exec prettier --write src/application src/transports test/transports
      - name: Add review regressions
        run: |
          cat > test/transports/review-regressions.test.ts <<'EOF'
          import { describe, expect, it } from 'vitest';

          import { IN_MEMORY_UNSUPPORTED_COMMANDS } from '../../src/application/in-memory-dispatcher.ts';
          import { parseApplicationCommand } from '../../src/application/validation.ts';
          import { createMcpTransport } from '../../src/transports/mcp/adapter.ts';

          const envelope = {
            protocolVersion: '0.1',
            workspaceId: 'ws-1',
            actor: { type: 'agent', id: 'agent-1' },
          } as const;

          describe('transport review regressions', () => {
            it('accepts the canonical BlockTask command shape without a duplicate summary field', () => {
              const result = parseApplicationCommand('BlockTask', {
                ...envelope,
                commandId: 'cmd-block',
                taskId: 'task-1',
                sessionId: 'session-1',
                leaseId: 'lease-1',
                fencingToken: 1,
                expectedTaskRevision: 2,
                reason: { code: 'task.blocked', summary: 'Need input.' },
                evidence: [],
              });
              expect(result.ok).toBe(true);
            });

            it('rejects malformed and oversized EvidenceRef arrays before dispatch', () => {
              const base = {
                ...envelope,
                commandId: 'cmd-block-evidence',
                taskId: 'task-1',
                sessionId: 'session-1',
                leaseId: 'lease-1',
                fencingToken: 1,
                expectedTaskRevision: 2,
                reason: { code: 'task.blocked', summary: 'Need input.' },
              };
              expect(parseApplicationCommand('BlockTask', { ...base, evidence: [{ uri: 123 }] }).ok).toBe(false);
              expect(
                parseApplicationCommand('BlockTask', {
                  ...base,
                  commandId: 'cmd-block-many',
                  evidence: Array.from({ length: 33 }, (_, index) => ({ uri: `evidence-${index}` })),
                }).ok,
              ).toBe(false);
            });

            it('enforces canonical PermissionRequest name and justification bounds', () => {
              const base = {
                ...envelope,
                commandId: 'cmd-permission',
                taskId: 'task-1',
                sessionId: 'session-1',
                leaseId: 'lease-1',
                fencingToken: 1,
                justification: 'Need repository write.',
              };
              expect(parseApplicationCommand('RequestPermission', { ...base, permission: 'NOT VALID' }).ok).toBe(false);
              expect(
                parseApplicationCommand('RequestPermission', {
                  ...base,
                  commandId: 'cmd-permission-long',
                  permission: 'repository.write',
                  justification: 'x'.repeat(2001),
                }).ok,
              ).toBe(false);
            });

            it('does not classify implemented runtime commands as unsupported', () => {
              expect(IN_MEMORY_UNSUPPORTED_COMMANDS).toEqual(['RegisterAgent', 'StartSession']);
            });

            it('exposes no generic authority/tool escape hatches', () => {
              const dispatcher = {
                dispatchCommand: async () => ({ protocolVersion: '0.1' as const, commandId: 'cmd-1', replayed: false, result: {} }),
                dispatchQuery: async () => ({ protocolVersion: '0.1' as const, result: {} }),
              };
              const authorizer = { authorize: async () => true };
              const names = createMcpTransport({ dispatcher, authorizer }).listTools().map((tool) => tool.name);
              for (const forbidden of ['execute_action', 'update_entity', 'patch_object', 'shell', 'filesystem', 'browser']) {
                expect(names).not.toContain(forbidden);
              }
            });
          });
          EOF
          pnpm exec prettier --write test/transports/review-regressions.test.ts
      - name: Run focused RED
        run: pnpm vitest run test/transports/review-regressions.test.ts
