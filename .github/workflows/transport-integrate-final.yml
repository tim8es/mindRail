name: Integrate transports final verification

on:
  push:
    branches:
      - integration/transports-v0-1
    paths:
      - .github/workflows/transport-integrate-final.yml

permissions:
  contents: write

jobs:
  integrate:
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: integration/transports-v0-1
          fetch-depth: 0
      - name: Setup Node
        uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e
        with:
          node-version-file: package.json
          package-manager-cache: false
      - name: Install pnpm
        run: npm install --global "$(node -p "require('./package.json').packageManager")"
      - name: Install dependencies
        run: pnpm install --frozen-lockfile
      - name: Materialize transport candidate
        run: git checkout origin/feature/transports-v0-1 -- src/application src/transports test/transports
      - name: Reconcile current protocol
        run: node scripts/tmp-transport-integrate.mjs
      - name: Remove obsolete helpers
        run: node scripts/tmp-transport-lint-cleanup.mjs
      - name: Format production and regression files
        run: pnpm exec prettier --write src/application src/transports src/runtime/protocol-validation.ts test/transports test/runtime/protocol-admission-bounds-review.test.ts
      - name: Focused tests
        run: pnpm vitest run test/transports test/runtime/protocol-admission-bounds-review.test.ts test/runtime/control-plane-runtime-surface.test.ts test/runtime/permission-engine.test.ts
      - name: Remove temporary harness
        run: git rm -f .github/workflows/transport-integrate-final.yml .github/workflows/transport-integrate-once.yml .github/workflows/transport-review-red.yml .github/workflows/protocol-admission-red.yml scripts/tmp-transport-integrate.mjs scripts/tmp-transport-lint-cleanup.mjs
      - name: Full quality on final tree
        run: pnpm check
      - name: Coverage on final tree
        run: pnpm test:coverage
      - name: Commit verified transports
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/application src/transports src/runtime/protocol-validation.ts test/transports test/runtime/protocol-admission-bounds-review.test.ts
          git commit -m "feat: integrate HTTP and MCP protocol adapters"
          git push origin HEAD:integration/transports-v0-1
