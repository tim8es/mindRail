name: Durable Task 2 once

on:
  push:
    branches:
      - feature/durable-application-composition
    paths:
      - scripts/tmp-durable-task2.mjs
      - .github/workflows/durable-task2-once.yml

permissions:
  contents: write

jobs:
  implement:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: feature/durable-application-composition
          fetch-depth: 0
      - uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e
        with:
          node-version-file: package.json
          package-manager-cache: false
      - run: npm install --global "$(node -p "require('./package.json').packageManager")"
      - run: pnpm install --frozen-lockfile
      - name: Apply Task 2
        run: node scripts/tmp-durable-task2.mjs
      - name: Format
        run: pnpm exec prettier --write src/runtime/state-rehydration.ts src/runtime/permission-service.ts src/runtime/in-memory-control-plane.ts test/runtime/runtime-rehydration.test.ts
      - name: Focused runtime verification
        run: pnpm vitest run test/runtime/runtime-rehydration.test.ts test/runtime/control-plane-runtime-surface.test.ts test/runtime/permission-engine.test.ts test/runtime/control-plane-review-regressions.test.ts
      - name: Remove temporary harness
        run: git rm .github/workflows/durable-task2-once.yml scripts/tmp-durable-task2.mjs
      - name: Full check
        run: pnpm check
      - name: Coverage
        run: pnpm test:coverage
      - name: Commit and push Task 2
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/runtime/state-rehydration.ts src/runtime/permission-service.ts src/runtime/in-memory-control-plane.ts test/runtime/runtime-rehydration.test.ts
          git commit -m "feat: support canonical runtime state rehydration"
          git push origin HEAD:feature/durable-application-composition
