name: Apply liveness review regressions once

on:
  push:
    branches:
      - feature/durable-session-lease-liveness

permissions:
  contents: write

jobs:
  review-regressions:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: feature/durable-session-lease-liveness
      - uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e
        with:
          node-version-file: package.json
          package-manager-cache: false
      - run: npm install --global "$(node -p "require('./package.json').packageManager")"
      - run: pnpm install --frozen-lockfile
      - run: python scripts/tmp/add-liveness-review-regressions.py
      - run: pnpm exec prettier --write test/persistence/d1-sqlite-harness.ts test/e2e/durable-session-lease-liveness-e2e.test.ts
      - name: Focused review regressions
        run: pnpm exec vitest run test/e2e/durable-session-lease-liveness-e2e.test.ts
      - run: pnpm check
      - run: pnpm test:coverage
      - run: git rm .github/workflows/apply-liveness-review-regressions-once.yml scripts/tmp/add-liveness-review-regressions.py
      - run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add test/persistence/d1-sqlite-harness.ts test/e2e/durable-session-lease-liveness-e2e.test.ts
          git commit -m "test: harden durable liveness replay atomicity"
          git push origin HEAD:feature/durable-session-lease-liveness
