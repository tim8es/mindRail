name: Format durable composition once

on:
  push:
    branches:
      - feature/durable-application-composition

permissions:
  contents: write

jobs:
  format:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout branch
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: feature/durable-application-composition
          fetch-depth: 0
      - name: Set up Node.js
        uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e
        with:
          node-version-file: package.json
          package-manager-cache: false
      - name: Install pnpm
        run: npm install --global "$(node -p "require('./package.json').packageManager")"
      - name: Install dependencies
        run: pnpm install --frozen-lockfile
      - name: Format files
        run: pnpm exec prettier --write docs/superpowers/specs/2026-08-29-durable-application-composition-design.md docs/superpowers/plans/2026-08-29-durable-application-composition.md test/persistence/receipt-parity.test.ts
      - name: Remove one-time formatter
        run: git rm .github/workflows/format-durable-once.yml
      - name: Commit and push
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add docs/superpowers/specs/2026-08-29-durable-application-composition-design.md docs/superpowers/plans/2026-08-29-durable-application-composition.md test/persistence/receipt-parity.test.ts
          git commit -m "style: format durable composition work"
          git push origin HEAD:feature/durable-application-composition
