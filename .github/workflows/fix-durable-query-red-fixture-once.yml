name: Fix durable query RED fixture once

on:
  push:
    branches:
      - feature/durable-query-parity
    paths:
      - .github/workflows/fix-durable-query-red-fixture-once.yml

permissions:
  contents: write

jobs:
  fix:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      - run: |
          python3 - <<'PY'
          from pathlib import Path
          path = Path('test/application/durable-query-parity.test.ts')
          text = path.read_text()
          old = """        sessionId: seeded.session.id,\n        leaseId: seeded.lease.id,\n        expectedLeaseRevision: seeded.lease.revision,"""
          new = """        sessionId: seeded.session.id,\n        taskId: seeded.firstTask.id,\n        leaseId: seeded.lease.id,\n        expectedLeaseRevision: seeded.lease.revision,"""
          if old not in text:
              raise SystemExit('ReleaseLease fixture target not found')
          path.write_text(text.replace(old, new, 1))
          PY
      - run: git rm .github/workflows/fix-durable-query-red-fixture-once.yml
      - run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add test/application/durable-query-parity.test.ts
          git commit -m "test: fix durable query release fixture"
          git push
