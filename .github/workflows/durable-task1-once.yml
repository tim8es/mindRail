name: Durable Task 1 once

on:
  push:
    branches:
      - feature/durable-application-composition
    paths:
      - scripts/tmp-durable-task1.mjs
      - .github/workflows/durable-task1-once.yml

permissions:
  contents: write

jobs:
  implement:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout branch
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: feature/durable-application-composition
          fetch-depth: 0
      - name: Set up Node.js
        uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e
        with:
          node-version-file: package.json
          package-manager-cache: false
      - name: Install pnpm
        run: npm install --global "$(node -p "require('./package.json').packageManager")"
      - name: Install dependencies
        run: pnpm install --frozen-lockfile
      - name: Apply Task 1 implementation
        run: node scripts/tmp-durable-task1.mjs
      - name: Format
        run: pnpm exec prettier --write src/persistence/ports.ts src/persistence/cloudflare/d1-runtime-persistence.ts test/persistence/receipt-parity.test.ts
      - name: Focused persistence verification
        run: pnpm vitest run test/persistence/receipt-parity.test.ts test/persistence/d1-runtime-persistence.test.ts test/persistence/d1-runtime-persistence-invariants.test.ts test/persistence/d1-runtime-persistence-review.test.ts
      - name: Full check
        run: pnpm check
      - name: Coverage
        run: pnpm test:coverage
      - name: Remove temporary harness
        run: git rm .github/workflows/durable-task1-once.yml scripts/tmp-durable-task1.mjs
      - name: Commit and push verified Task 1
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/persistence/ports.ts src/persistence/cloudflare/d1-runtime-persistence.ts test/persistence/receipt-parity.test.ts
          git commit -m "feat: add receipt parity to durable mutation ports"
          git push origin HEAD:feature/durable-application-composition
