name: Harden task execution view once

on:
  push:
    branches:
      - feature/durable-query-parity
    paths:
      - .github/workflows/harden-task-execution-view-once.yml

permissions:
  contents: write

jobs:
  harden:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      - uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e
        with:
          node-version-file: package.json
          package-manager-cache: false
      - run: npm install --global "$(node -p "require('./package.json').packageManager")"
      - run: pnpm install --frozen-lockfile
      - run: |
          python3 - <<'PY'
          from pathlib import Path
          path = Path('src/persistence/cloudflare/d1-runtime-persistence.ts')
          text = path.read_text()
          marker = '''interface PendingPermissionRow {\n  request_json: string;\n  decision_json: string;\n}\n'''
          replacement = marker + '''\ninterface TaskExecutionViewRow {\n  task_json: string;\n  lease_json: string | null;\n  checkpoint_json: string | null;\n}\n'''
          if marker not in text:
              raise SystemExit('row marker not found')
          text = text.replace(marker, replacement, 1)
          start = text.index('  async getTaskExecutionView(\n')
          end = text.index('\n\n  async loadWorkspaceState(', start)
          method = '''  async getTaskExecutionView(\n    workspaceId: string,\n    taskId: string,\n    now: string,\n    sessionCutoff: string,\n  ): Promise<TaskExecutionView | undefined> {\n    const row = await this.first<TaskExecutionViewRow>(\n      `SELECT\n         t.record_json AS task_json,\n         CASE WHEN t.status = 'running' THEN (\n           SELECT l.record_json\n           FROM leases l\n           JOIN sessions s\n             ON s.workspace_id = l.workspace_id AND s.id = l.session_id\n           WHERE l.workspace_id = t.workspace_id\n             AND l.task_id = t.id\n             AND l.status = 'active'\n             AND l.expires_at_ms > ?\n             AND s.status = 'active'\n             AND s.last_seen_at_ms > ?\n           ORDER BY l.fencing_token DESC\n           LIMIT 1\n         ) ELSE NULL END AS lease_json,\n         (\n           SELECT c.record_json\n           FROM checkpoints c\n           WHERE c.workspace_id = t.workspace_id AND c.task_id = t.id\n           ORDER BY c.created_at_ms DESC, c.id DESC\n           LIMIT 1\n         ) AS checkpoint_json\n       FROM tasks t\n       WHERE t.workspace_id = ? AND t.id = ?`,\n      timestampMs(now, 'Task execution view now'),\n      timestampMs(sessionCutoff, 'Task execution view session cutoff'),\n      workspaceId,\n      taskId,\n    );\n    if (!row) return undefined;\n    return {\n      task: parseJson<Task>(row.task_json, 'Task execution view Task'),\n      ...(row.lease_json === null\n        ? {}\n        : { lease: parseJson<Lease>(row.lease_json, 'Task execution view Lease') }),\n      ...(row.checkpoint_json === null\n        ? {}\n        : {\n            latestCheckpoint: parseJson<Checkpoint>(\n              row.checkpoint_json,\n              'Task execution view Checkpoint',\n            ),\n          }),\n    };\n  }'''
          text = text[:start] + method + text[end:]
          path.write_text(text)
          PY
      - run: pnpm exec prettier --write src/persistence/cloudflare/d1-runtime-persistence.ts
      - run: git rm .github/workflows/harden-task-execution-view-once.yml
      - run: pnpm vitest run test/application/durable-query-parity.test.ts test/application/durable-queries.test.ts
      - run: pnpm check
      - run: pnpm test:coverage
      - run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/persistence/cloudflare/d1-runtime-persistence.ts
          git commit -m "fix: read task execution view atomically"
          git push
