name: Feature proposal
description: Propose a capability from a user/problem perspective
title: 'feat: '
labels: []
body:
  - type: textarea
    id: problem
    attributes:
      label: Problem
      description: What user or agent problem exists today?
    validations:
      required: true
  - type: textarea
    id: outcome
    attributes:
      label: Desired outcome
      description: What should become possible? Avoid prescribing unnecessary implementation detail.
    validations:
      required: true
  - type: textarea
    id: evidence
    attributes:
      label: Evidence / use case
      description: Concrete workflow, failure, or repeated cost that justifies this capability.
    validations:
      required: true
  - type: textarea
    id: constraints
    attributes:
      label: Constraints
      description: Security, compatibility, provider-neutrality, or scope constraints already known.
